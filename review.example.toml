# Copy outside Git working trees to ~/.code-reviewer/review.toml (chmod 600).
# Project-directory review.toml is not loaded. VM-default and explicit host reviews are wired; live VM inference remains untested.
# Every key is optional; the values below are the defaults.
provider = "claude"  # runtime adapter: claude or openai
auth_mode = "api-key" # subscription selects CLAUDE_CODE_OAUTH_TOKEN for Claude; ChatGPT login is not implemented
sandbox = true       # default VM request; false or --no-sandbox explicitly selects the host

# OpenAI: set one explicit model ID for all model_* roles, supply current positive USD/million token rates,
# and set OPENAI_API_KEY in the process environment. Zero defaults mean rates are not configured.
# No key belongs in this TOML file or on the command line.
openai_input_price = 0.0
openai_cached_input_price = 0.0
openai_output_price = 0.0

# Review flow: single-agent (default); agent-personas defaults to three passes for each of four personas, then conflict-only verification.
review_mode = "single-agent"

# Persona mode: scheduled passes per persona (4 times this many total); --passes N overrides for one run.
persona_passes = 3
# Persona Reviewers run concurrently within a round, then merge serially; --parallel N overrides.
persona_parallel = 4

# Models: any alias or full name accepted by `claude --model`.
model_reviewer = "haiku"
model_comparator = "haiku"   # "sonnet" merges duplicate findings more consistently but costs ~15x more for this step
model_resolver = "haiku"   # also used for project-rule classification in persona mode
model_verifier = "haiku"   # persona conflict annotations only

# Reviewer refutes its own findings in a second phase.
self_check = true

# merge | project_only | defaults_only
criteria_mode = "merge"
# Path to a JSON manifest that replaces the criteria resolver's output (reproducible experiments).
criteria_manifest = ""
# Default rule IDs to switch off, for example ["GEN-003"].
disabled_default_rules = []

# Single-agent loop control (persona mode uses persona_passes, with no quiet-pass stopping)
min_passes = 3
max_passes = 6
quiet_k = 2                    # stop after this many consecutive passes with no new finding
max_consecutive_failures = 2    # single-agent globally; persona mode separately per persona

# Confidence tiers: share of completed passes that found an issue
tier_high = 0.75
tier_medium = 0.40

# Limits
max_diff_lines = 3000          # changed lines after exclusions
persona_prompt_max_chars = 500000  # complete persona call/retry text; never silently truncated
criteria_max_chars = 200000    # about 50k tokens
# Files left out of the diff, and about which no findings are reported. A trailing slash matches a directory anywhere in the
# path, including several folders such as "docs/plans/". This list REPLACES the built-in one (lockfiles, minified, generated, vendor/ ...).
# exclude_patterns = ["package-lock.json", "yarn.lock", "*.min.js", "vendor/", "node_modules/"]
# Added to the built-in list instead of replacing it. Planning documents (PRDs, implementation plans) are the author's claims and may
# drift from the code, so leave them out of the prompt (the reviewer can still open them); public API or event docs must stay in.
# extra_exclude_patterns = ["docs/prds/", "docs/plans/"]

# Matching tuning (rarely needed)
candidate_window = 20          # same-file line distance for duplicate candidates
candidate_all_threshold = 30   # up to this many findings the Comparator sees all of them
candidate_max = 40
grounding_line_window = 30     # count corrections exceeding this distance; quotes are searched across the file

# Budgets and timeouts
call_budget_usd = 0.50         # --max-budget-usd for every claude call
call_timeout_s = 600
run_budget_usd = 3.00         # personas: 10% criteria, 10% Comparator, 13 1/3% Verifier, remainder split equally
run_budget_tokens = 2000000    # counts input, output and cache-write tokens; cache reads are not counted

# Claude Code binary (name on PATH or full path)
claude_bin = "claude"

# Flags that isolate the reviewer from local Claude Code configuration. Do not remove unless you know why.
isolation_flags = ["--safe-mode", "--restricted"]

# Confidence tiers shown in the review summary and included in a posted comment (single-pass findings are always included)
post_tiers = ["High", "Medium", "Low"]

# Replace email addresses in the PR title, description and commit messages with [email] before sending (not the diff)
redact_emails = true

# Where runs are stored (default: ~/.code-reviewer/runs)
runs_dir = ""

# VM-default execution: use the persistent setup in docs/sandbox-check.md.
# Keep installed artifacts/Lima state outside /tmp and /private/tmp; these paths must be absolute.
# vm_artifacts = "/absolute/path/to/verified-artifacts"
# vm_lima_home = "/absolute/path/to/dedicated-lima-state"
# vm_instance = "reviewer-sandbox"
# vm_timeout_s = 1800
# Required only when provider = "claude": a verified Linux ARM64 native artifact.
# vm_claude_binary = "/absolute/path/to/linux-arm64-claude"
# vm_claude_sha256 = "verified-lowercase-sha256"

# Credentials come from the selected process environment; NEVER put key/token values here.
