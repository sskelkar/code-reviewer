# Dedicated outer Linux/KVM worker. No reviewed repository or credentials belong here.
# Store LIMA_HOME persistently (for example ~/.code-reviewer/lima), never under /tmp.
minimumLimaVersion: "1.0.0"
vmType: "vz"
arch: "aarch64"
cpus: 4
memory: "6GiB"
disk: "12GiB"
nestedVirtualization: true
plain: true
mounts: []
propagateProxyEnv: false
containerd:
  system: false
  user: false
ssh:
  forwardAgent: false
  forwardX11: false
  loadDotSSHPubKeys: false
images:
  # Official Ubuntu 24.04 ARM64 image checksum, verified 2026-10-30.
  # The digest must be updated deliberately if the upstream release URL changes.
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e"
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends python3 git busybox-static cpio iproute2 nftables squid ca-certificates curl xz-utils build-essential libssl-dev zlib1g-dev libffi-dev libbz2-dev liblzma-dev libsqlite3-dev libreadline-dev libncurses-dev
      systemctl disable --now squid
      test -c /dev/kvm
      # Dedicated application interpreter; never replace Ubuntu's /usr/bin/python3.
      build=$(mktemp -d)
      trap 'rm -rf "$build"' EXIT
      cd "$build"
      curl --fail --location --proto '=https' --tlsv1.2 --output Python.tar.xz https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
      echo 'abb0102e6d4ae027509bcb82327d9dd85515b44a3ba8ad538cfc5e9847029f68  Python.tar.xz' | sha256sum --check -
      tar -xf Python.tar.xz
      cd Python-3.13.18
      ./configure --prefix=/usr/local --with-ensurepip=no
      make -j4
      make altinstall
      /usr/local/bin/python3.13 -c 'import ssl, zlib, tomllib; import sys; assert sys.version_info[:2] == (3, 13)'
